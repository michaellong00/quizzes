<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 5: A New Nation – Answer Key</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f4f6fb; color:#1d2433; line-height:1.45; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.45rem; margin:0 0 4px; }
  .sub { color:#5b6475; margin:0 0 16px; font-size:.95rem; }
  ol { padding-left:0; list-style:none; margin:0; }
  li { background:#fff; border-radius:12px; padding:12px 16px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.05); break-inside:avoid; }
  .q { font-weight:600; }
  .ans { margin-top:4px; color:#1f7a45; font-weight:600; }
  .ex { margin-top:2px; color:#4a5263; font-size:.93rem; }
  .letter { display:inline-block; min-width:1.6em; text-align:center; background:#1f9d55; color:#fff; border-radius:6px; margin-right:6px; font-weight:700; }
  .grid { margin-top:18px; background:#fff; border-radius:12px; padding:12px 16px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.95rem; }
  .actions a, .actions button { font-size:.9rem; margin-right:12px; color:#2f6fed; background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }
  @media print { body { background:#fff; font-size:10.5pt; } li { box-shadow:none; border:1px solid #ddd; padding:6px 10px; margin-bottom:5px; } .actions { display:none; } main { padding:0; max-width:none; } }
</style>
</head>
<body>
<main>
  <h1>Module 5: A New Nation – Answer Key</h1>
  <p class="sub"><span id="count"></span> questions · Generated from the same question list the quiz uses.</p>
  <p class="actions"><a href="./">Back to quiz</a><button onclick="window.print()">Print</button><a href="study-guide-answers.html">Study guide answers</a></p>
  <ol id="key"></ol>
  <div class="grid" id="grid"></div>
</main>
<script src="questions.js"></script>
<script>
const L = ['A','B','C','D'];
document.getElementById('count').textContent = QUESTIONS.length;
document.getElementById('key').innerHTML = QUESTIONS.map((q, n) =>
  '<li><div class="q">' + (n+1) + '. ' + q.q + '</div>' +
  '<div class="ans"><span class="letter">' + L[q.a] + '</span>' + q.o[q.a] + '</div>' +
  '<div class="ex">' + q.e + '</div></li>').join('');
document.getElementById('grid').innerHTML = '<strong>Quick key:</strong> ' + QUESTIONS.map((q, n) => (n+1) + '-' + L[q.a]).join('&nbsp; ');
</script>
</body>
</html>
