<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Washington's Presidency &amp; Foreign Affairs – Practice Quiz</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1d2433; --muted:#5b6475; --accent:#2f6fed; --good:#1f9d55; --bad:#d64545; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  main { max-width:680px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:.95rem; }
  .bar { height:8px; background:#dde3ef; border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .qnum { color:var(--muted); font-size:.85rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .q { font-size:1.15rem; font-weight:600; margin:6px 0 16px; }
  .opt { display:block; width:100%; text-align:left; padding:14px 16px; margin:0 0 10px; font-size:1rem; border:2px solid #d5dbe7; border-radius:10px; background:#fff; color:var(--ink); cursor:pointer; min-height:48px; }
  .opt:hover:not(:disabled) { border-color:var(--accent); }
  .opt:disabled { cursor:default; }
  .opt.correct { border-color:var(--good); background:#e8f7ee; }
  .opt.wrong { border-color:var(--bad); background:#fdeaea; }
  .fb { margin-top:6px; padding:12px 14px; border-radius:10px; font-size:.97rem; display:none; }
  .fb.good { display:block; background:#e8f7ee; border-left:4px solid var(--good); }
  .fb.bad { display:block; background:#fdeaea; border-left:4px solid var(--bad); }
  .btn { display:inline-block; margin-top:16px; padding:12px 22px; font-size:1rem; font-weight:600; border:none; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; min-height:48px; }
  .btn[hidden] { display:none; }
  .score { font-size:2.4rem; font-weight:700; margin:8px 0; }
  .review { margin-top:16px; padding-left:20px; }
  .review li { margin-bottom:8px; }
  .ok { color:var(--good); font-weight:600; } .no { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Washington's Presidency &amp; Tackling Foreign Affairs</h1>
  <p class="sub">17 questions · Pick an answer to see if you're right and why.</p>
  <div class="bar"><div id="progress"></div></div>
  <div class="card" id="quiz"></div>
</main>
<script>
const QUESTIONS = [
  { q: "What did the Judiciary Act of 1789 do?",
    o: ["Created the president's cabinet", "Set up the national court system", "Created the Bank of the United States", "Placed a tax on imported goods"],
    a: 1, e: "The Judiciary Act of 1789 set up the national (federal) court system, including federal courts below the Supreme Court." },
  { q: "The president's chief advisers, such as the heads of departments, are called the…",
    o: ["Congress", "Cabinet", "Supreme Court", "Electoral College"],
    a: 1, e: "The cabinet is the group of chief advisers to the president. Washington's cabinet included Alexander Hamilton and Thomas Jefferson." },
  { q: "Alexander Hamilton is best described as…",
    o: ["The leader of the Democratic-Republicans", "A French diplomat", "An early Federalist leader", "A Native American leader"],
    a: 2, e: "Hamilton was an early Federalist leader. He supported a strong national government and the Bank of the United States." },
  { q: "The Bank of the United States was…",
    o: ["A national bank funded by the federal government and wealthy investors", "A bank owned only by the states", "A bank set up by Britain in America", "A bank funded by an excise tax only"],
    a: 0, e: "The Bank of the United States was a national bank funded by the federal government together with wealthy private investors." },
  { q: "Which political party was led by Thomas Jefferson?",
    o: ["The Federalists", "The Whigs", "The Republicans of today", "The Democratic-Republicans"],
    a: 3, e: "Jefferson led the Democratic-Republicans, the ancestors of today's Democratic Party. Hamilton led the Federalists." },
  { q: "A political system in which two parties compete for power is called a…",
    o: ["Two-party system", "Cabinet", "Confederacy", "Sectionalism"],
    a: 0, e: "In a two-party system, two political parties compete for power. In the 1790s it was the Federalists against the Democratic-Republicans." },
  { q: "A tax on goods imported from other countries, meant to protect American businesses, is a…",
    o: ["Excise tax", "Protective tariff", "Sales tax", "Income tax"],
    a: 1, e: "A protective tariff taxes imported goods so they cost more, which helps domestic (American) businesses compete." },
  { q: "A tax on goods produced within the country, like American-made whiskey, is a…",
    o: ["Protective tariff", "Import duty", "Excise tax", "Bribe"],
    a: 2, e: "An excise tax is a tax on goods made inside the country. Tip: a tariff is on imports, and an excise tax is on homemade goods." },
  { q: "When Washington declared neutrality, it meant the United States would…",
    o: ["Join France against Britain", "Join Britain against France", "Support neither side", "Declare war on Spain"],
    a: 2, e: "Neutrality means supporting neither side. Washington kept the U.S. out of the war between France and Britain." },
  { q: "Who was Edmond Genêt?",
    o: ["A French diplomat who tried to get American support against the British", "A British general", "The negotiator of a treaty with Spain", "A leader of the Native American confederacy"],
    a: 0, e: "Edmond Genêt was a French diplomat who tried to win American support against the British, which went against Washington's policy of neutrality." },
  { q: "Thomas Pinckney negotiated a treaty with which country?",
    o: ["Britain", "France", "Spain", "Mexico"],
    a: 2, e: "Thomas Pinckney negotiated a treaty with Spain over Spanish lands east of the Mississippi River. Remember: Pinckney goes with Spain, and Jay goes with Britain." },
  { q: "John Jay negotiated a treaty with which country over territory?",
    o: ["Spain", "Britain", "France", "Russia"],
    a: 1, e: "Jay's Treaty was with Britain and dealt with territory disputes." },
  { q: "Little Turtle led a Native American confederacy against the Americans in which battle?",
    o: ["The Battle of Fallen Timbers", "The Battle of Yorktown", "The Battle of Saratoga", "The Battle of Bunker Hill"],
    a: 0, e: "Little Turtle led a Native American confederacy against American forces in the Battle of Fallen Timbers." },
  { q: "The XYZ Affair caused American anger because…",
    o: ["Britain seized American ships", "French diplomats demanded bribes", "Spain closed the Mississippi River", "Congress passed new taxes"],
    a: 1, e: "In the XYZ Affair, French diplomats demanded bribes from American officials, which made many Americans angry at France." },
  { q: "The Alien and Sedition Acts…",
    o: ["Made it easier to become a citizen", "Created the national court system", "Made it harder to become a citizen and harshly punished people who criticized the government", "Ended the two-party system"],
    a: 2, e: "The Alien Acts made it harder to become a citizen, and the Sedition Act set harsh punishments for criticizing the government." },
  { q: "The idea that a state could void a law it believed was unconstitutional is called…",
    o: ["Sectionalism", "Neutrality", "Nullification", "Ratification"],
    a: 2, e: "Nullification is the idea that states had the right to nullify, or void, any law they considered unconstitutional." },
  { q: "Placing the interests of one region above the interests of the nation as a whole is called…",
    o: ["Nationalism", "Sectionalism", "Federalism", "Neutrality"],
    a: 1, e: "Sectionalism means putting one region's (section's) interests above those of the whole nation." }
];

let i = 0, score = 0, answers = [];
const quiz = document.getElementById('quiz');
const progress = document.getElementById('progress');
const LETTERS = ['A','B','C','D'];

function render() {
  progress.style.width = (i / QUESTIONS.length * 100) + '%';
  const item = QUESTIONS[i];
  quiz.innerHTML =
    '<div class="qnum">Question ' + (i+1) + ' of ' + QUESTIONS.length + '</div>' +
    '<div class="q">' + item.q + '</div>' +
    item.o.map((t, k) => '<button class="opt" data-k="' + k + '">' + LETTERS[k] + '. ' + t + '</button>').join('') +
    '<div class="fb" id="fb"></div>' +
    '<button class="btn" id="next" hidden>' + (i === QUESTIONS.length - 1 ? 'See my score' : 'Next question') + '</button>';
  quiz.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => choose(+b.dataset.k)));
  document.getElementById('next').addEventListener('click', () => { i++; i < QUESTIONS.length ? render() : finish(); });
}

function choose(k) {
  const item = QUESTIONS[i], right = k === item.a;
  if (right) score++;
  answers.push(right);
  const opts = quiz.querySelectorAll('.opt');
  opts.forEach(b => b.disabled = true);
  opts[item.a].classList.add('correct');
  if (!right) opts[k].classList.add('wrong');
  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (right ? 'good' : 'bad');
  fb.innerHTML = '<strong>' + (right ? 'Correct!' : 'Not quite. The answer is ' + LETTERS[item.a] + '.') + '</strong> ' + item.e;
  const next = document.getElementById('next');
  next.hidden = false; next.focus();
}

function finish() {
  progress.style.width = '100%';
  const pct = Math.round(score / QUESTIONS.length * 100);
  const msg = pct >= 90 ? 'Excellent work!' : pct >= 70 ? 'Nice job. Review the ones you missed.' : 'Keep practicing. Go back over the explanations and try again.';
  quiz.innerHTML =
    '<div class="qnum">Your score</div>' +
    '<div class="score">' + score + ' / ' + QUESTIONS.length + ' (' + pct + '%)</div>' +
    '<p>' + msg + '</p>' +
    '<ol class="review">' + QUESTIONS.map((q, n) => '<li><span class="' + (answers[n] ? 'ok">✓' : 'no">✗') + '</span> ' + q.q + '</li>').join('') + '</ol>' +
    '<button class="btn" id="retry">Retry quiz</button>';
  document.getElementById('retry').addEventListener('click', () => { i = 0; score = 0; answers = []; render(); window.scrollTo(0,0); });
}

render();
</script>
</body>
</html>
