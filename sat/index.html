<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SAT Practice Test (Adaptive, Digital Format)</title>
<style>:root{--ink:#1b2230;--muted:#5d6678;--line:#d7dce5;--bg:#f4f6fa;--card:#fff;--accent:#2a55c9;--accent-soft:#e9efff;
--ok:#1d7a40;--ok-soft:#e5f4ea;--bad:#b42318;--bad-soft:#fdecea;--warn:#8a5a00;--warn-soft:#fff4d6;--flag:#c2410c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.topnav{background:#fff;border-bottom:1px solid var(--line)}
.topnav .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;margin-right:auto;font-size:1.05rem}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent-soft);color:var(--accent)}
h1{font-size:1.7rem;line-height:1.25;margin:.3em 0 .2em}
h2{font-size:1.3rem;margin:.2em 0 .5em}
h3{font-size:1.08rem;margin:1.2em 0 .5em}
.sub{color:var(--muted);margin:0 0 1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0}
.note{background:var(--warn-soft);border:1px solid #efd48c;border-radius:10px;padding:10px 14px;font-size:.94rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.choicecard h3{margin:.1em 0 .3em}
.choicecard ul{padding-left:1.1em;margin:.3em 0 .9em;color:var(--muted);font-size:.93rem}
.btn{display:inline-block;font-weight:650;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table.t{border-collapse:collapse;width:100%;font-size:.93rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{background:#f0f2f7;font-weight:650}
table.t td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.prio td{background:var(--bad-soft)}
.tw{overflow-x:auto}
.tag{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.p{background:var(--bad);color:#fff}.tag.s{background:var(--ok);color:#fff}.tag.m{background:#dfe4ec}
.tag.e{background:#e3f1e8;color:#14532d}.tag.md{background:#fff1cc;color:#7a4b00}.tag.h{background:#fde2e0;color:#8f1d14}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.kpi div{background:#f5f7fb;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}
.kpi b{display:block;font-size:1.45rem}
.kpi span{color:var(--muted);font-size:.85rem}
.miss{border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:8px;padding:10px 14px;margin:10px 0;background:#fff}
.miss.ok{border-left-color:var(--ok)}
.miss .h{font-weight:700}
.miss .d{color:var(--muted);font-size:.85rem;margin:2px 0 6px}
.miss details{margin-top:6px}
.miss summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.qcopy{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:.93rem}
.qcopy .opt{margin:2px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;max-width:100%}
/* ---- test UI ---- */
body.testing{background:#fff}
.tbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px dashed #c9cfda}
.tbar .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 16px;max-width:1400px;margin:0 auto}
.tbar .title{font-weight:700;font-size:.98rem;line-height:1.3}
.tbar .title small{display:block;font-weight:500;color:var(--muted)}
.timer{text-align:center}
.timer .tv{font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.timer.warn .tv{color:var(--warn)}.timer.over .tv{color:var(--bad)}
.timer button{display:block;margin:0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 10px;font-size:.78rem;cursor:pointer}
.tools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.86rem;font-weight:600}
.tool:hover{border-color:var(--accent);color:var(--accent)}
.banner{background:var(--warn-soft);border-bottom:1px solid #efd48c;text-align:center;padding:6px 12px;font-size:.92rem;font-weight:600}
.banner.over{background:var(--bad-soft);border-color:#f1b0aa}
.tmain{max-width:1400px;margin:0 auto;padding:0 0 90px}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 150px)}
.split .lp{padding:24px 28px;border-right:3px solid #e3e7ee;overflow-wrap:anywhere}
.split .rp{padding:24px 28px}
.single{max-width:760px;margin:0 auto;padding:24px 20px}
.qhead{display:flex;align-items:center;gap:10px;background:#f1f3f7;border-bottom:2px dashed #c9cfda;padding:6px 8px;margin-bottom:14px;border-radius:4px 4px 0 0}
.qbox{background:var(--ink);color:#fff;font-weight:800;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.flagbtn{border:0;background:none;cursor:pointer;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:5px;color:var(--muted)}
.flagbtn.on{color:var(--flag)}
.flagbtn svg{width:16px;height:16px}
.stem{margin:0 0 14px;font-weight:500}
.passage p{margin:.2em 0 .8em}
.textlabel{font-weight:700;margin-bottom:0!important}
.notes{margin:.2em 0 .6em;padding-left:1.2em}
.notes li{margin:.15em 0}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid #9aa3b2;border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer;line-height:1.5}
.choice:hover{border-color:var(--accent)}
.choice .L{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid #59627a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem}
.choice.sel{border:2.5px solid var(--accent);background:var(--accent-soft);padding:9px 11px}
.choice.sel .L{background:var(--accent);border-color:var(--accent);color:#fff}
.gridin input{font:inherit;font-size:1.25rem;padding:8px 12px;border:2px solid #9aa3b2;border-radius:8px;width:220px;max-width:100%}
.gridin input:focus{outline:none;border-color:var(--accent)}
.gridin .pv{margin-top:6px;color:var(--muted);font-size:.92rem}
.gridin .pv.bad{color:var(--bad)}
.gridhelp{font-size:.88rem;color:var(--muted);background:#f6f7fa;border-radius:8px;padding:8px 12px;margin-top:14px}
.gridhelp ul{margin:.3em 0;padding-left:1.1em}
table.data{border-collapse:collapse;margin:6px 0 12px;font-size:.94rem;max-width:100%}
table.data caption{font-weight:700;text-align:left;padding-bottom:4px}
table.data th,table.data td{border:1px solid #aeb6c4;padding:5px 10px;text-align:center}
table.data thead th{background:#eef1f6}
table.data tbody th{background:#f6f8fb;text-align:left}
svg.chart{width:100%;max-width:520px;height:auto;display:block;margin:4px 0 12px;font-family:inherit}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px dashed #c9cfda}
.bnav .in{max-width:1400px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.bnav .who{color:var(--muted);font-size:.88rem}
.qpick{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer}
.bnav .nb{display:flex;gap:8px;justify-content:flex-end}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal .box{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px 20px;margin-bottom:64px}
.modal.center{align-items:center}.modal.center .box{margin-bottom:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:6px 0 12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.qg{position:relative;height:42px;border:1.5px dashed #7d8698;background:#fff;border-radius:6px;font-weight:700;cursor:pointer;color:var(--accent)}
.qg.ans{border:1.5px solid var(--accent);background:var(--accent);color:#fff}
.qg.cur::after{content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.qg .fl{position:absolute;top:-6px;right:-6px;width:15px;height:15px;color:var(--flag)}
.review{max-width:760px;margin:0 auto;padding:28px 20px;text-align:center}
.review .qgrid{margin:18px 0}
/* calculator */
#calc{position:fixed;right:14px;bottom:78px;z-index:40;width:290px;background:#1f2633;color:#fff;border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#calc .ch{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
#calc .ch button{background:none;border:0;color:#fff;font-size:1.2rem;cursor:pointer}
#calc input{width:100%;font:16px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px;border-radius:8px;border:0;margin-bottom:4px}
#calc .res{min-height:1.5em;text-align:right;font:15px ui-monospace,Menlo,Consolas,monospace;color:#bfe3c8;margin-bottom:8px;overflow-wrap:anywhere}
#calc .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#calc .keys button{padding:9px 0;border-radius:8px;border:0;background:#394254;color:#fff;cursor:pointer;font-weight:600}
#calc .keys button.op{background:#4a5873}#calc .keys button.eq{background:var(--accent)}
.ref{font-size:.93rem}.ref li{margin:.25em 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;z-index:60;font-size:.92rem;max-width:92vw;text-align:center}
textarea.exp{width:100%;min-height:220px;font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace}
@media (max-width:900px){
 .split{grid-template-columns:1fr;min-height:0}
 .split .lp{border-right:0;border-bottom:3px solid #e3e7ee;padding:16px}
 .split .rp{padding:16px}
 .single{padding:16px}
}
@media (max-width:640px){
 body{font-size:16px}
 .wrap{padding:10px 10px 50px}.card{padding:14px}
 .tbar .in{grid-template-columns:1fr auto;padding:6px 10px}
 .tbar .tools{grid-column:1 / -1;justify-content:flex-start}
 .tbar .title{font-size:.88rem}
 .bnav .in{grid-template-columns:auto 1fr;padding:8px 10px}
 .bnav .who{display:none}
 .bnav .nb .btn{padding:8px 14px}
 #calc{right:8px;left:8px;width:auto}
 table.t{font-size:.84rem}table.t th,table.t td{padding:6px 5px}
 table.data{font-size:.84rem}table.data th,table.data td{padding:4px 6px}
 .kpi div{min-width:0;flex:1 1 40%}
}
@media print{.topnav,.tbar,.bnav,.btn,.filters{display:none!important}body{background:#fff}.card{border:0}}
</style></head>

<script>"use strict";
/* ===== data ===== */
const BANK = [{"id": "E1-01", "mod": "E1", "n": 1, "section": "english", "type": "mc", "passage": "<p>The museum's new wing was designed to be ______: staff can rearrange its movable walls and benches to suit exhibits of almost any size or shape.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["adaptable", "permanent", "ornate", "isolated"]}, {"id": "E1-02", "mod": "E1", "n": 2, "section": "english", "type": "mc", "passage": "<p>Although early reviewers dismissed the novelist's debut as derivative, later readers came to see its many borrowings as ______: the author had deliberately reworked familiar plots in order to expose the assumptions hidden inside them.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["accidental", "excessive", "purposeful", "concealed"]}, {"id": "E1-03", "mod": "E1", "n": 3, "section": "english", "type": "mc", "passage": "<p>In her study of urban foxes, biologist Mara Kell found that the animals' behavior was far from ______; individual foxes developed strikingly different routines, with some foraging only near parks and others only along rail lines.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["unusual", "deliberate", "uniform", "observable"]}, {"id": "E1-04", "mod": "E1", "n": 4, "section": "english", "type": "mc", "passage": "<p>The composer's late string quartets are often described as austere, but that label can mislead. Though the scores contain few dramatic flourishes, their restraint is ______ rather than empty: each sparse phrase carries a weight of implication that rewards careful listening.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["eloquent", "extravagant", "hesitant", "conventional"]}, {"id": "E1-05", "mod": "E1", "n": 5, "section": "english", "type": "mc", "passage": "<p>Many home gardeners assume that watering plants a little every day is best. <u>In fact, frequent shallow watering can weaken plants by encouraging their roots to stay near the surface.<\/u> Watering deeply but less often pushes roots to grow downward, where the soil stays moist longer.<\/p>", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It challenges the assumption described in the previous sentence.", "It gives an example of a plant that needs daily watering.", "It summarizes the benefits of daily watering.", "It introduces a gardener whose methods the text goes on to defend."]}, {"id": "E1-06", "mod": "E1", "n": 6, "section": "english", "type": "mc", "passage": "<p>Inés had rehearsed the speech for weeks, but when she stepped onto the stage, the words she had memorized seemed to belong to someone else. She glanced at the front row, where her grandfather sat with his hat in his lap, nodding slowly as if he had already heard every word. She folded her note cards, set them on the podium, and began to speak to him instead.<\/p>", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It describes a character's careful preparation and then explains why that preparation was unnecessary.", "It contrasts a character's view of an event with her grandfather's view of the same event.", "It recounts a performance and then describes how the audience reacted to it.", "It portrays a character's sudden uncertainty and then shows how she finds a way to continue."]}, {"id": "E1-07", "mod": "E1", "n": 7, "section": "english", "type": "mc", "passage": "<p>Researchers who study how technologies spread have noticed that the first design to gain wide adoption often persists long after better alternatives appear. Once many people have learned a system and many products have been built around it, switching carries costs that no single user wants to bear alone. A design's survival, then, may say less about its quality than about its timing.<\/p>", "stem": "Which choice best states the main purpose of the text?", "opts": ["To explain why an established design can endure even when superior alternatives exist", "To argue that the earliest designs of a technology are usually the most effective", "To describe how researchers measure the quality of a design", "To recommend that users adopt newer designs as soon as they become available"]}, {"id": "E1-08", "mod": "E1", "n": 8, "section": "english", "type": "mc", "passage": "<p class='textlabel'>Text 1<\/p><p>Some literary scholars argue that a novel's meaning is fixed by its author's intentions. On this view, reading a book well means reconstructing, as precisely as possible, what its writer meant to say.<\/p><p class='textlabel'>Text 2<\/p><p>Critic Ana Ruiz contends that once a work is published, readers from different eras inevitably bring new questions to it. For Ruiz, these fresh readings are not errors but part of the work's life: a novel can come to mean things its author never anticipated.<\/p>", "stem": "Based on the texts, how would Ruiz (Text 2) most likely respond to the scholars discussed in Text 1?", "opts": ["By agreeing that readers should focus mainly on reconstructing an author's intended meaning", "By arguing that an author's intentions do not fully limit what a novel can legitimately mean", "By claiming that most authors have no clear intentions when they write", "By suggesting that older novels are harder to interpret than recent ones"]}, {"id": "E1-09", "mod": "E1", "n": 9, "section": "english", "type": "mc", "passage": "<p>When the only grocery store in the small town of Millbrook closed, residents faced a forty-minute drive for fresh food. Rather than wait for a new chain store to arrive, more than three hundred residents each bought a share in a community-owned grocery cooperative. Five years later, the store earns a modest profit, and many shoppers say it has also become the town's favorite place to run into neighbors.<\/p>", "stem": "Which choice best states the main idea of the text?", "opts": ["A community-owned grocery store helped one town meet both a practical need and a social one.", "Millbrook residents prefer shopping at large chain stores.", "Most grocery cooperatives fail within a few years of opening.", "Small towns rarely have enough residents to support a grocery store."]}, {"id": "E1-10", "mod": "E1", "n": 10, "section": "english", "type": "mc", "passage": "<p>Teodoro kept the bakery's oldest oven even after the new electric ones arrived. The other bakers laughed at how he fussed over its temperamental fire, adjusting the damper a dozen times each morning. Still, every day the first loaves he pulled from it sold out before the rest of the bread had even cooled.<\/p>", "stem": "According to the text, what is true about the loaves Teodoro bakes in the old oven?", "opts": ["They take less time to bake than loaves from the electric ovens.", "They are baked only on special occasions.", "They are popular with customers and sell out quickly.", "They are sold at a higher price than the other loaves."]}, {"id": "E1-11", "mod": "E1", "n": 11, "section": "english", "type": "mc", "passage": "<p>A student claims that in the poem \"Low Tide,\" the speaker finds a sense of calm when alone by the sea.<\/p>", "stem": "Which quotation from the poem most effectively illustrates the student's claim?", "opts": ["\"The gulls argued loudly over scraps of bread / tossed from the crowded pier.\"", "\"I hurried home along the shore / before the evening storm could break.\"", "\"My brother called my name across the sand / until I turned and waved.\"", "\"Alone at last, I let the slow waves / smooth the noise of the day from my mind.\""]}, {"id": "E1-12", "mod": "E1", "n": 12, "section": "english", "type": "mc", "passage": "<svg viewBox=\"0 0 520 300\" class=\"chart\" role=\"img\" aria-label=\"Average Daily Visitors to Linden Park, by Season\"><text x=\"260.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"15\">Average Daily Visitors to Linden Park, by Season<\/text><line x1=\"60\" y1=\"250.0\" x2=\"504\" y2=\"250.0\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"254.0\" text-anchor=\"end\" font-size=\"12\">0<\/text><line x1=\"60\" y1=\"219.4\" x2=\"504\" y2=\"219.4\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"223.4\" text-anchor=\"end\" font-size=\"12\">100<\/text><line x1=\"60\" y1=\"188.9\" x2=\"504\" y2=\"188.9\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"192.9\" text-anchor=\"end\" font-size=\"12\">200<\/text><line x1=\"60\" y1=\"158.3\" x2=\"504\" y2=\"158.3\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"162.3\" text-anchor=\"end\" font-size=\"12\">300<\/text><line x1=\"60\" y1=\"127.7\" x2=\"504\" y2=\"127.7\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"131.7\" text-anchor=\"end\" font-size=\"12\">400<\/text><line x1=\"60\" y1=\"97.1\" x2=\"504\" y2=\"97.1\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"101.1\" text-anchor=\"end\" font-size=\"12\">500<\/text><line x1=\"60\" y1=\"66.6\" x2=\"504\" y2=\"66.6\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"70.6\" text-anchor=\"end\" font-size=\"12\">600<\/text><line x1=\"60\" y1=\"36.0\" x2=\"504\" y2=\"36.0\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" font-size=\"12\">700<\/text><rect x=\"85.0\" y=\"121.6\" width=\"61.1\" height=\"128.4\" fill=\"#4a6fb5\"/><text x=\"115.5\" y=\"116.6\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">420<\/text><text x=\"115.5\" y=\"268.0\" text-anchor=\"middle\" font-size=\"13\">Spring<\/text><rect x=\"196.0\" y=\"63.5\" width=\"61.1\" height=\"186.5\" fill=\"#4a6fb5\"/><text x=\"226.5\" y=\"58.5\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">610<\/text><text x=\"226.5\" y=\"268.0\" text-anchor=\"middle\" font-size=\"13\">Summer<\/text><rect x=\"307.0\" y=\"133.8\" width=\"61.1\" height=\"116.2\" fill=\"#4a6fb5\"/><text x=\"337.5\" y=\"128.8\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">380<\/text><text x=\"337.5\" y=\"268.0\" text-anchor=\"middle\" font-size=\"13\">Fall<\/text><rect x=\"418.0\" y=\"204.1\" width=\"61.1\" height=\"45.9\" fill=\"#4a6fb5\"/><text x=\"448.5\" y=\"199.1\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">150<\/text><text x=\"448.5\" y=\"268.0\" text-anchor=\"middle\" font-size=\"13\">Winter<\/text><line x1=\"60\" y1=\"250\" x2=\"504\" y2=\"250\" stroke=\"#333\"/><text transform=\"translate(16 143.0) rotate(-90)\" text-anchor=\"middle\" font-size=\"12\">Visitors per day<\/text><\/svg><p>A student studying park use notes that visits to Linden Park peak in summer and fall off sharply in winter.<\/p>", "stem": "Which choice most effectively uses data from the graph to support the student's observation?", "opts": ["The park averaged 610 daily visitors in summer but only 150 in winter.", "The park averaged 420 daily visitors in spring and 380 in fall.", "The park averaged more daily visitors in spring than in fall.", "The park averaged 380 daily visitors in fall and 150 in winter."]}, {"id": "E1-13", "mod": "E1", "n": 13, "section": "english", "type": "mc", "passage": "<table class=\"data\"><caption>Average Height Gain of Bean Plants After 4 Weeks (cm)<\/caption><thead><tr><th>Temperature<\/th><th>Fertilizer A<\/th><th>Fertilizer B<\/th><th>Fertilizer C<\/th><\/tr><\/thead><tbody><tr><th>18°C<\/th><td>4.1<\/td><td>6.3<\/td><td>3.9<\/td><\/tr><tr><th>26°C<\/th><td>7.2<\/td><td>8.0<\/td><td>6.5<\/td><\/tr><\/tbody><\/table><p>A team of students tested three fertilizers on bean plants grown at two temperatures. They hypothesized that Fertilizer B's advantage over Fertilizer A would be greater at the cooler temperature than at the warmer temperature.<\/p>", "stem": "Which choice best describes data from the table that support the students' hypothesis?", "opts": ["At both temperatures, plants given Fertilizer B grew more than plants given Fertilizer C.", "At 18°C, plants given Fertilizer B grew 6.3 cm compared with 4.1 cm for Fertilizer A, while at 26°C they grew 8.0 cm compared with 7.2 cm.", "Plants given Fertilizer A grew 7.2 cm at 26°C but only 4.1 cm at 18°C.", "Plants given Fertilizer C grew the least at both temperatures."]}, {"id": "E1-14", "mod": "E1", "n": 14, "section": "english", "type": "mc", "passage": "<p>Bird surveys in Harlow Valley found that a certain songbird species nested only in meadows that were mowed no more than once each summer. In meadows mowed more often, the researchers found no nests at all, even though they regularly observed the birds feeding there. These findings suggest that ______<\/p>", "stem": "Which choice most logically completes the text?", "opts": ["the songbirds prefer to feed in meadows that are rarely mowed.", "mowing has no effect on where the songbirds choose to nest.", "frequent mowing may make a meadow unsuitable for nesting but not for feeding.", "the songbirds feed only in meadows where they have built nests."]}, {"id": "E1-15", "mod": "E1", "n": 15, "section": "english", "type": "mc", "passage": "<p>Archaeologists studying the ancient city of Kesh found that its earliest houses were built of stone, while later houses were built of mud brick. Stone quarries near Kesh show signs of having been exhausted around the time this shift occurred, yet there is no evidence that the city's population declined or that construction slowed. Taken together, this evidence most strongly suggests that ______<\/p>", "stem": "Which choice most logically completes the text?", "opts": ["the people of Kesh considered mud brick superior to stone for every type of building.", "Kesh's builders turned to mud brick at least partly because local stone became scarce, not because the city was in decline.", "Kesh's population declined after its quarries were exhausted.", "mud-brick houses in Kesh lasted longer than stone houses did."]}, {"id": "E1-16", "mod": "E1", "n": 16, "section": "english", "type": "mc", "passage": "<p>The orchestra's youngest member, a fourteen-year-old violist named Priya Shah ______ performed a solo at the spring concert.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Shah", "Shah;", "Shah:", "Shah,"]}, {"id": "E1-17", "mod": "E1", "n": 17, "section": "english", "type": "mc", "passage": "<p>Artist Leo Rivera builds his sculptures entirely from discarded materials ______ bottle caps, broken tiles, and scraps of sheet metal.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["materials;", "materials", "materials, and", "materials:"]}, {"id": "E1-18", "mod": "E1", "n": 18, "section": "english", "type": "mc", "passage": "<p>The trail was much steeper than the map had suggested ______ the hikers reached the summit nearly an hour later than they had planned.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["suggested, as a result,", "suggested; as a result,", "suggested as a result", "suggested, as a result"]}, {"id": "E1-19", "mod": "E1", "n": 19, "section": "english", "type": "mc", "passage": "<p>In her essay, the critic argues that the novel's true subject is not the war itself but the silence that follows it ______ the long years in which survivors struggle to describe what they witnessed.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["it;", "it, and", "it", "it—"]}, {"id": "E1-20", "mod": "E1", "n": 20, "section": "english", "type": "mc", "passage": "<p>The bicycles parked outside the library ______ to students who live in the nearby dormitory.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["belongs", "belong", "is belonging", "has belonged"]}, {"id": "E1-21", "mod": "E1", "n": 21, "section": "english", "type": "mc", "passage": "<p>Each of the city's three public pools will extend ______ hours during the summer heat wave.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["its", "their", "it's", "they're"]}, {"id": "E1-22", "mod": "E1", "n": 22, "section": "english", "type": "mc", "passage": "<p>By the end of next year, the research team ______ more than ten thousand soil samples from sites across the region.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["collected", "will have collected", "has collected", "had collected"]}, {"id": "E1-23", "mod": "E1", "n": 23, "section": "english", "type": "mc", "passage": "<p>Most bats hunt at night by using echolocation, bouncing sounds off objects to locate them. ______ some fruit bats rely mainly on their keen eyesight and sense of smell to find food.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Similarly,", "For example,", "However,", "Therefore,"]}, {"id": "E1-24", "mod": "E1", "n": 24, "section": "english", "type": "mc", "passage": "<p>When the town launched its new recycling program, many residents were confused and placed the wrong items in their blue bins. ______ the town mailed every household a simple illustrated guide, and within two months the number of incorrect items in the bins had fallen by half.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless,", "Likewise,", "By contrast,", "In response,"]}, {"id": "E1-25", "mod": "E1", "n": 25, "section": "english", "type": "mc", "passage": "<p>Painter Jun Takeda rarely sketched before beginning a canvas, preferring to let each composition emerge as he worked. ______ the dozens of notebooks discovered after his death show that he spent years making careful studies of light and shadow.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Therefore,", "Even so,", "For instance,", "In other words,"]}, {"id": "E1-26", "mod": "E1", "n": 26, "section": "english", "type": "mc", "passage": "<p>While researching a topic, a student has taken the following notes:<\/p><ul class='notes'><li>The Alder Street Bridge opened in 1931.<\/li><li>It was designed by engineer Clara Voss.<\/li><li>It is a steel arch bridge that spans 240 meters.<\/li><li>In 2019, it closed for repairs.<\/li><li>It reopened in 2022 with a new pedestrian lane.<\/li><\/ul><p>The student wants to emphasize a recent change to the bridge.<\/p>", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Alder Street Bridge, a steel arch bridge, spans 240 meters.", "Engineer Clara Voss designed the Alder Street Bridge, which opened in 1931.", "Reopened in 2022 after repairs, the Alder Street Bridge now includes a new pedestrian lane.", "The Alder Street Bridge opened in 1931 and is a steel arch bridge."]}, {"id": "E1-27", "mod": "E1", "n": 27, "section": "english", "type": "mc", "passage": "<p>While researching a topic, a student has taken the following notes:<\/p><ul class='notes'><li>The Corra tree frog and the Velu tree frog both live in cloud forests.<\/li><li>Corra frogs lay their eggs on leaves that hang over streams.<\/li><li>When Corra tadpoles hatch, they drop into the water below.<\/li><li>Velu frogs lay their eggs in small pools of water inside tree holes.<\/li><li>Velu tadpoles feed on unfertilized eggs that their mother deposits.<\/li><\/ul><p>The student wants to contrast where the two species lay their eggs.<\/p>", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Both Corra tree frogs and Velu tree frogs live in cloud forests.", "Velu tree frog tadpoles feed on unfertilized eggs that their mother deposits.", "While Corra tree frogs lay their eggs on leaves over streams, Velu tree frogs lay theirs in pools of water inside tree holes.", "Corra tree frogs lay their eggs on leaves, and the tadpoles drop into streams below."]}, {"id": "EE-01", "mod": "EE", "n": 1, "section": "english", "type": "mc", "passage": "<p>After the storm knocked out the power, the shop owner set candles along the shelves to ______ the dark store so that customers could still find what they needed.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["illuminate", "decorate", "conceal", "measure"]}, {"id": "EE-02", "mod": "EE", "n": 2, "section": "english", "type": "mc", "passage": "<p>Coach Rivera is known for her ______ approach to teaching: she explains every drill step by step and makes sure each player understands it before moving on.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["careless", "hurried", "patient", "secretive"]}, {"id": "EE-03", "mod": "EE", "n": 3, "section": "english", "type": "mc", "passage": "<p>Because the bridge was closed for repairs, drivers had to take a ______ route through the hills that added twenty minutes to their trip.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["direct", "quicker", "brief", "roundabout"]}, {"id": "EE-04", "mod": "EE", "n": 4, "section": "english", "type": "mc", "passage": "<p>The scientist's findings proved to be ______: other laboratories repeated her experiment several times and got the same results each time.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["reliable", "surprising", "temporary", "unpopular"]}, {"id": "EE-05", "mod": "EE", "n": 5, "section": "english", "type": "mc", "passage": "<p>Sea otters often float on their backs while they eat. <u>An otter will place a flat rock on its chest and strike shellfish against it to crack them open.<\/u> Because of this habit, sea otters are often described as one of the few mammals other than primates that use tools.<\/p>", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It explains why sea otters float on their backs.", "It introduces a debate about whether otters really use tools.", "It describes a specific behavior that the next sentence identifies as tool use.", "It compares the eating habits of sea otters and primates."]}, {"id": "EE-06", "mod": "EE", "n": 6, "section": "english", "type": "mc", "passage": "<p>Many people think of moss as nothing more than a soft green carpet. But a single patch of moss can be home to dozens of tiny creatures, from mites to microscopic animals, that live in the moisture trapped among its leaves.<\/p>", "stem": "Which choice best states the main purpose of the text?", "opts": ["To explain how moss traps moisture", "To describe how tiny creatures survive dry weather", "To show that moss supports more life than people might expect", "To argue that moss should be removed from gardens"]}, {"id": "EE-07", "mod": "EE", "n": 7, "section": "english", "type": "mc", "passage": "<p>For most of the twentieth century, the town of Fernhill depended on a single paper mill for most of its jobs. When the mill closed, many families moved away, and shops along Main Street shut their doors. In recent years, however, a group of residents has turned the old mill into workspaces for small businesses, and the town's population has begun to grow again.<\/p>", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It compares the histories of two different towns.", "It explains in detail how paper is manufactured.", "It argues that towns should never depend on a single employer.", "It describes a town's decline and then its more recent recovery."]}, {"id": "EE-08", "mod": "EE", "n": 8, "section": "english", "type": "mc", "passage": "<p class='textlabel'>Text 1<\/p><p>Some teachers believe homework should be assigned every night. Regular practice, they argue, is the best way to help students remember what they learn in class.<\/p><p class='textlabel'>Text 2<\/p><p>A group of education researchers compared two classes. One received nightly homework, and the other received short assignments only twice a week. On a later test, students in both classes remembered the material equally well, and students in the second class reported feeling less stressed.<\/p>", "stem": "Based on the texts, how would the researchers in Text 2 most likely respond to the teachers in Text 1?", "opts": ["By agreeing that nightly homework is the only way to help students remember material", "By arguing that homework has no effect at all on what students remember", "By claiming that students prefer to receive homework every night", "By pointing out that less frequent assignments can help students remember material just as well as nightly homework"]}, {"id": "EE-09", "mod": "EE", "n": 9, "section": "english", "type": "mc", "passage": "<p>Every spring, volunteers in the town of Oakridge gather to clean up the banks of Miller Creek. They pick up trash, plant native shrubs, and record the kinds of birds they see. Over the past ten years, the volunteers have recorded more and more kinds of birds returning to the creek.<\/p>", "stem": "Which choice best states the main idea of the text?", "opts": ["Oakridge has too few volunteers to keep Miller Creek clean.", "Birds in Oakridge prefer to live near busy roads.", "Volunteers' yearly work has helped improve the area around Miller Creek.", "Miller Creek was created by the town ten years ago."]}, {"id": "EE-10", "mod": "EE", "n": 10, "section": "english", "type": "mc", "passage": "<p>Maya had always been afraid of deep water. That summer, she signed up for swimming lessons at the lake. By August, she could swim across the roped-off area without stopping, and she spent her afternoons diving for smooth stones on the lake bottom.<\/p>", "stem": "Based on the text, how has Maya changed by the end of the summer?", "opts": ["She has decided to become a swimming teacher.", "She has grown more afraid of the lake.", "She has become comfortable in deep water.", "She has stopped going to the lake in the afternoons."]}, {"id": "EE-11", "mod": "EE", "n": 11, "section": "english", "type": "mc", "passage": "<p>A student is writing about a study of gardening and stress. The student claims that the study's results suggest that gardening may help reduce stress.<\/p>", "stem": "Which finding from the study, if true, would most directly support the student's claim?", "opts": ["Participants who gardened grew more vegetables than participants who did not garden.", "Most participants said they preferred to garden in the morning rather than the evening.", "Participants who gardened for 30 minutes had lower levels of a stress hormone afterward than participants who read indoors for 30 minutes.", "Participants who read indoors read an average of 20 pages in 30 minutes."]}, {"id": "EE-12", "mod": "EE", "n": 12, "section": "english", "type": "mc", "passage": "<table class=\"data\"><caption>Items Checked Out from Pine Street Library in March<\/caption><thead><tr><th>Type of item<\/th><th>Number checked out<\/th><\/tr><\/thead><tbody><tr><th>Fiction<\/th><td>1,240<\/td><\/tr><tr><th>Nonfiction<\/th><td>860<\/td><\/tr><tr><th>Graphic novels<\/th><td>410<\/td><\/tr><tr><th>Audiobooks<\/th><td>290<\/td><\/tr><\/tbody><\/table><p>The librarian noted that fiction was the most popular type of item checked out in March, with ______<\/p>", "stem": "Which choice most effectively uses data from the table to complete the statement?", "opts": ["410 checkouts, compared with 290 for audiobooks.", "1,240 checkouts, compared with 860 for nonfiction, the next most popular type.", "860 checkouts, compared with 410 for graphic novels.", "290 checkouts, compared with 1,240 for graphic novels."]}, {"id": "EE-13", "mod": "EE", "n": 13, "section": "english", "type": "mc", "passage": "<svg viewBox=\"0 0 520 300\" class=\"chart\" role=\"img\" aria-label=\"Average Hours of Sleep per School Night, by Grade\"><text x=\"260.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"15\">Average Hours of Sleep per School Night, by Grade<\/text><line x1=\"60\" y1=\"250.0\" x2=\"504\" y2=\"250.0\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"254.0\" text-anchor=\"end\" font-size=\"12\">0<\/text><line x1=\"60\" y1=\"223.2\" x2=\"504\" y2=\"223.2\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"227.2\" text-anchor=\"end\" font-size=\"12\">1<\/text><line x1=\"60\" y1=\"196.5\" x2=\"504\" y2=\"196.5\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"200.5\" text-anchor=\"end\" font-size=\"12\">2<\/text><line x1=\"60\" y1=\"169.8\" x2=\"504\" y2=\"169.8\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"173.8\" text-anchor=\"end\" font-size=\"12\">3<\/text><line x1=\"60\" y1=\"143.0\" x2=\"504\" y2=\"143.0\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"147.0\" text-anchor=\"end\" font-size=\"12\">4<\/text><line x1=\"60\" y1=\"116.2\" x2=\"504\" y2=\"116.2\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"120.2\" text-anchor=\"end\" font-size=\"12\">5<\/text><line x1=\"60\" y1=\"89.5\" x2=\"504\" y2=\"89.5\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"93.5\" text-anchor=\"end\" font-size=\"12\">6<\/text><line x1=\"60\" y1=\"62.8\" x2=\"504\" y2=\"62.8\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"66.8\" text-anchor=\"end\" font-size=\"12\">7<\/text><line x1=\"60\" y1=\"36.0\" x2=\"504\" y2=\"36.0\" stroke=\"#d5dae3\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" font-size=\"12\">8<\/text><rect x=\"85.0\" y=\"46.7\" width=\"61.1\" height=\"203.3\" fill=\"#4a6fb5\"/><text x=\"115.5\" y=\"41.7\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">7.6<\/text><text x=\"115.5\" y=\"268.0\" text-anchor=\"middle\" font-size=\"13\">Grade 9<\/text><rect x=\"196.0\" y=\"57.4\" width=\"61.1\" height=\"192.6\" fill=\"#4a6fb5\"/><text x=\"226.5\" y=\"52.4\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">7.2<\/text><text x=\"226.5\" y=\"268.0\" text-anchor=\"middle\" font-size=\"13\">Grade 10<\/text><rect x=\"307.0\" y=\"68.1\" width=\"61.1\" height=\"181.9\" fill=\"#4a6fb5\"/><text x=\"337.5\" y=\"63.1\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">6.8<\/text><text x=\"337.5\" y=\"268.0\" text-anchor=\"middle\" font-size=\"13\">Grade 11<\/text><rect x=\"418.0\" y=\"76.1\" width=\"61.1\" height=\"173.9\" fill=\"#4a6fb5\"/><text x=\"448.5\" y=\"71.1\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">6.5<\/text><text x=\"448.5\" y=\"268.0\" text-anchor=\"middle\" font-size=\"13\">Grade 12<\/text><line x1=\"60\" y1=\"250\" x2=\"504\" y2=\"250\" stroke=\"#333\"/><text transform=\"translate(16 143.0) rotate(-90)\" text-anchor=\"middle\" font-size=\"12\">Hours<\/text><\/svg><p>A school nurse surveyed students about their sleep. She claims that students tend to get less sleep as they move into higher grades.<\/p>", "stem": "Which choice most effectively uses data from the graph to support the nurse's claim?", "opts": ["Ninth graders reported an average of 7.6 hours of sleep per school night, while twelfth graders reported 6.5 hours.", "Tenth graders reported an average of 7.2 hours of sleep per school night.", "Ninth graders reported less sleep than tenth graders did.", "Eleventh graders reported an average of 6.8 hours of sleep per school night."]}, {"id": "EE-14", "mod": "EE", "n": 14, "section": "english", "type": "mc", "passage": "<p>A bakery found that its blueberry muffins sold out every Saturday by 9 a.m., while many of its bran muffins went unsold. The owner decided to start baking twice as many blueberry muffins on Saturdays. The owner most likely made this decision because ______<\/p>", "stem": "Which choice most logically completes the text?", "opts": ["customers wanted more blueberry muffins on Saturdays than the bakery had been making.", "bran muffins cost more to bake than blueberry muffins.", "customers preferred bran muffins to blueberry muffins.", "the bakery is closed on Sundays."]}, {"id": "EE-15", "mod": "EE", "n": 15, "section": "english", "type": "mc", "passage": "<p>In an experiment, researchers hung two identical bird feeders in a yard, one painted red and one painted green. Hummingbirds visited the red feeder far more often. When the researchers switched the positions of the two feeders, hummingbirds still visited the red feeder far more often. These results suggest that ______<\/p>", "stem": "Which choice most logically completes the text?", "opts": ["hummingbirds are unable to see the color green.", "a feeder's position is the main factor in attracting hummingbirds.", "the green feeder held less food than the red feeder.", "the hummingbirds' preference was based on the feeders' color rather than their location."]}, {"id": "EE-16", "mod": "EE", "n": 16, "section": "english", "type": "mc", "passage": "<p>The team's goalkeeper made seven saves in the championship game ______ she was named the tournament's most valuable player.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["game,", "game, and", "game", "game and,"]}, {"id": "EE-17", "mod": "EE", "n": 17, "section": "english", "type": "mc", "passage": "<p>My grandmother's bread recipe calls for only three ingredients ______ flour, water, and salt.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["ingredients;", "ingredients:", "ingredients, they are", "ingredients, which"]}, {"id": "EE-18", "mod": "EE", "n": 18, "section": "english", "type": "mc", "passage": "<p>Dr. Amara Bell, a marine biologist ______ studies how coral reefs recover after major storms.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["biologist", "biologist,", "biologist;", "biologist—"]}, {"id": "EE-19", "mod": "EE", "n": 19, "section": "english", "type": "mc", "passage": "<p>The museum opened a new exhibit on ancient pottery last week ______ more than two thousand people have already visited it.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["week;", "week,", "week", "week, which"]}, {"id": "EE-20", "mod": "EE", "n": 20, "section": "english", "type": "mc", "passage": "<p>The list of supplies for next week's camping trip ______ posted on the classroom door.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["are", "were", "is", "have been"]}, {"id": "EE-21", "mod": "EE", "n": 21, "section": "english", "type": "mc", "passage": "<p>Last summer, Jordan ______ at an animal shelter, where he walked dogs and cleaned cages every morning.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["volunteered", "volunteers", "will volunteer", "has been volunteering"]}, {"id": "EE-22", "mod": "EE", "n": 22, "section": "english", "type": "mc", "passage": "<p>When the students finished ______ science projects, the teacher displayed them in the front hallway.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["its", "their", "there", "they're"]}, {"id": "EE-23", "mod": "EE", "n": 23, "section": "english", "type": "mc", "passage": "<p>Penguins cannot fly. ______ they are excellent swimmers, using their wings like flippers to move quickly through the water.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["For example,", "However,", "Therefore,", "Similarly,"]}, {"id": "EE-24", "mod": "EE", "n": 24, "section": "english", "type": "mc", "passage": "<p>To build the new garden beds, the class first cleared away rocks and weeds. ______ the students mixed compost into the soil and planted the seeds.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["In contrast,", "For instance,", "Nevertheless,", "Next,"]}, {"id": "EE-25", "mod": "EE", "n": 25, "section": "english", "type": "mc", "passage": "<p>The new bus route was supposed to shorten commutes for people living on the east side of the city. ______ many riders reported that their trips actually took longer, because the buses often got stuck in heavy traffic on Main Street.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Similarly,", "As expected,", "In addition,", "However,"]}, {"id": "EE-26", "mod": "EE", "n": 26, "section": "english", "type": "mc", "passage": "<p>While researching a topic, a student has taken the following notes:<\/p><ul class='notes'><li>The Harbor Lights Festival takes place each July in the town of Port Elm.<\/li><li>Local artists build lanterns shaped like boats and fish.<\/li><li>On the festival's last night, the lanterns are floated in the harbor.<\/li><li>About 5,000 people attend the festival each year.<\/li><\/ul><p>The student wants to tell readers how many people attend the festival.<\/p>", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Harbor Lights Festival takes place each July in Port Elm.", "About 5,000 people attend Port Elm's Harbor Lights Festival each year.", "Local artists build lanterns shaped like boats and fish for the festival.", "On the festival's last night, lanterns are floated in the harbor."]}, {"id": "EE-27", "mod": "EE", "n": 27, "section": "english", "type": "mc", "passage": "<p>While researching a topic, a student has taken the following notes:<\/p><ul class='notes'><li>Cacti and snake plants are popular houseplants.<\/li><li>Cacti need bright, direct sunlight.<\/li><li>Snake plants can grow well in low light.<\/li><li>Both plants need to be watered only every two to three weeks.<\/li><\/ul><p>The student wants to emphasize a similarity between the two plants.<\/p>", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Both cacti and snake plants need to be watered only every two to three weeks.", "Cacti need bright light, while snake plants can grow well in low light.", "Snake plants can grow well in low light.", "Cacti need bright, direct sunlight."]}, {"id": "EH-01", "mod": "EH", "n": 1, "section": "english", "type": "mc", "passage": "<p>Although the committee's report ran to more than eighty pages, its recommendations were ______: in just three sentences, it proposed cutting the budget, delaying construction, and hiring an outside auditor.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["vague", "succinct", "redundant", "tentative"]}, {"id": "EH-02", "mod": "EH", "n": 2, "section": "english", "type": "mc", "passage": "<p>Historian Delia Marsh cautions against treating the town's surviving letters as a ______ record of daily life there. Because only wealthy families could afford to preserve their correspondence, she notes, the archive reflects the concerns of a narrow few.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["representative", "fragile", "personal", "detailed"]}, {"id": "EH-03", "mod": "EH", "n": 3, "section": "english", "type": "mc", "passage": "<p>Critics who call the director's films ______ overlook how carefully each scene is planned: what appears spontaneous on screen is usually the product of weeks of rehearsal.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["improvised", "meticulous", "derivative", "lengthy"]}, {"id": "EH-04", "mod": "EH", "n": 4, "section": "english", "type": "mc", "passage": "<p>In her later work, the poet abandoned the dense allusions of her early books in favor of plain language, a shift that some readers ______ as a loss of ambition but that she described as an effort to reach a wider audience.<\/p>", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["concealed", "celebrated", "interpreted", "predicted"]}, {"id": "EH-05", "mod": "EH", "n": 5, "section": "english", "type": "mc", "passage": "<p>Ecologists long assumed that the decline of the salmon population in the Ashby River was caused by overfishing. <u>Yet catch records show that fishing on the river had already fallen sharply a decade before salmon numbers began to drop.<\/u> More recent studies point instead to rising water temperatures caused by the removal of shade trees along the riverbanks.<\/p>", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It offers support for the claim that overfishing caused the decline.", "It presents evidence that undermines the explanation described in the previous sentence.", "It describes the method ecologists used to count the salmon population.", "It introduces the explanation that the text ultimately favors."]}, {"id": "EH-06", "mod": "EH", "n": 6, "section": "english", "type": "mc", "passage": "<p>The letter arrived on a Tuesday, which seemed fitting, since nothing important ever happened on Tuesdays. Nadia left it on the counter beneath a bowl of lemons and went about her morning: she watered the ferns, swept the porch, and answered two emails about a meeting she had no intention of attending. Only after lunch, when the light had shifted across the kitchen, did she lift the bowl and slide a knife beneath the envelope's flap.<\/p>", "stem": "Which choice best states the main purpose of the text?", "opts": ["To show that the character is too busy with important work to read her mail", "To convey a character's reluctance to face something by showing how she puts it off", "To describe the routine that the character follows every Tuesday", "To suggest that the letter contains disappointing news about a meeting"]}, {"id": "EH-07", "mod": "EH", "n": 7, "section": "english", "type": "mc", "passage": "<p>Mathematician Ruth Okafor observes that many students think of a proof as a final step, a way of confirming something already known to be true. For working mathematicians, she argues, attempting a proof is often how a problem's structure is discovered: even a failed proof can reveal exactly which assumption was false.<\/p>", "stem": "Which choice best states the main purpose of the text?", "opts": ["To present a view of proofs as a tool for discovery rather than merely for confirmation", "To argue that students should no longer be asked to write proofs", "To describe a specific problem that Okafor solved by writing a proof", "To explain why most proofs written by mathematicians end in failure"]}, {"id": "EH-08", "mod": "EH", "n": 8, "section": "english", "type": "mc", "passage": "<p class='textlabel'>Text 1<\/p><p>Many urban planners favor building dense housing near train stations. Residents who live close to transit, they argue, will drive less, easing traffic congestion and lowering emissions.<\/p><p class='textlabel'>Text 2<\/p><p>In a survey of new housing developments near train stations, researcher Petra Lindqvist found that residents did ride trains more than people living elsewhere—but only in buildings that limited parking. In buildings that offered ample parking, residents' driving habits were nearly the same as those of people living far from any station.<\/p>", "stem": "Based on the texts, how would Lindqvist (Text 2) most likely respond to the planners' argument in Text 1?", "opts": ["She would say that it is mistaken, because people living near transit never ride trains more than other people do.", "She would say that it is correct, because living near transit reduces driving regardless of other factors.", "She would say that it is irrelevant, because most emissions come from industry rather than from cars.", "She would say that it is plausible but that the expected reduction in driving may depend on whether parking is limited."]}, {"id": "EH-09", "mod": "EH", "n": 9, "section": "english", "type": "mc", "passage": "<p>For years, the Brightwater Theater struggled to fill seats for its productions of classical plays. Rather than drop these plays, its new director paired each production with free workshops in local schools, where students rehearsed scenes and met the actors. Within two seasons, attendance among young audiences had tripled, and many of those students returned to later shows with their families.<\/p>", "stem": "Which choice best states the main idea of the text?", "opts": ["A theater increased attendance at its classical plays by building connections with local students.", "The Brightwater Theater stopped producing classical plays because of low attendance.", "Students generally prefer modern plays to classical ones.", "The theater's actors were reluctant to visit local schools."]}, {"id": "EH-10", "mod": "EH", "n": 10, "section": "english", "type": "mc", "passage": "<p>The old map hung in the hallway, its coastlines brown with age. Grandfather had drawn it from memory decades after leaving the island, and Mira had long ago noticed that it was wrong: the harbor too wide, the hills too close to the shore. Only recently had she begun to suspect that the errors were not mistakes at all, but a record of how the place had felt to a boy who had to leave it.<\/p>", "stem": "According to the text, what does Mira now suspect about her grandfather's map?", "opts": ["Its inaccuracies reflect his emotional memories of the island.", "It was copied from an older and more accurate map.", "He intentionally misled others about where the island is located.", "The island's geography has changed since he left it."]}, {"id": "EH-11", "mod": "EH", "n": 11, "section": "english", "type": "mc", "passage": "<p>Literary scholar Tomas Amadi argues that in the novel <i>The Salt Road<\/i>, the narrator's frequent descriptions of weather mirror her shifting emotional state rather than simply setting the scene.<\/p>", "stem": "Which quotation from <i>The Salt Road<\/i> most effectively illustrates Amadi's claim?", "opts": ["\"The valley received more rain that spring than in any year anyone could remember.\"", "\"The morning I learned of the sale, a gray rain settled over the valley, and it did not lift until I had made my peace with leaving.\"", "\"We packed the wagons early in the morning, before the heat of the day could rise.\"", "\"My brother kept a careful record of each day's temperature in a leather notebook.\""]}, {"id": "EH-12", "mod": "EH", "n": 12, "section": "english", "type": "mc", "passage": "<p>Researchers hypothesize that a certain ground beetle avoids open fields because the lack of plant cover exposes it to birds that hunt it.<\/p>", "stem": "Which finding, if true, would most directly weaken the researchers' hypothesis?", "opts": ["Beetles that entered open fields were frequently eaten by birds.", "Beetles living in wooded areas were larger, on average, than those living near fields.", "Birds were more common in open fields than in wooded areas.", "In fields where birds had been kept out with netting, the beetles still avoided open areas just as strongly."]}, {"id": "EH-13", "mod": "EH", "n": 13, "section": "english", "type": "mc", "passage": "<table class=\"data\"><caption>Bike Lanes and Bicycle Commuting in Four Cities<\/caption><thead><tr><th>City<\/th><th>Miles of protected bike lanes<\/th><th>Percent of workers who commute by bicycle<\/th><\/tr><\/thead><tbody><tr><th>City A<\/th><td>12<\/td><td>3.1%<\/td><\/tr><tr><th>City B<\/th><td>25<\/td><td>5.8%<\/td><\/tr><tr><th>City C<\/th><td>31<\/td><td>5.2%<\/td><\/tr><tr><th>City D<\/th><td>48<\/td><td>9.4%<\/td><\/tr><\/tbody><\/table><p>A transportation researcher claims that cities with more miles of protected bike lanes tend to have higher rates of bicycle commuting, although the relationship is not perfectly consistent.<\/p>", "stem": "Which choice best describes data from the table that support the researcher's claim?", "opts": ["City A had the fewest miles of bike lanes and the lowest rate of bike commuting.", "City D had both the most miles of bike lanes and the highest rate of bike commuting, but City C had more miles of bike lanes than City B and a slightly lower rate of bike commuting.", "City B had 25 miles of protected bike lanes and a bike commuting rate of 5.8%.", "City C had a lower rate of bike commuting than City D but a higher rate than City A."]}, {"id": "EH-14", "mod": "EH", "n": 14, "section": "english", "type": "mc", "passage": "<p>In a study, young children watched an adult open a puzzle box. One group saw the adult pull a lever, press a button, and also tap the lid, a step that had no visible effect. Another group saw the adult use only the lever and button. When the children were then given the box, those in the first group almost always tapped the lid too, even though they could see that tapping did nothing. These results suggest that ______<\/p>", "stem": "Which choice most logically completes the text?", "opts": ["young children cannot figure out how a puzzle box works without help from an adult.", "young children may copy an adult's actions even when those actions do not seem to serve any purpose.", "tapping the lid made the puzzle box easier to open.", "children in the second group were unable to open the puzzle box."]}, {"id": "EH-15", "mod": "EH", "n": 15, "section": "english", "type": "mc", "passage": "<p>A survey of 500 small businesses in Halden County found that businesses that began offering online ordering in 2020 reported higher revenue in 2022 than businesses that did not. However, the businesses that adopted online ordering were, on average, larger and already earned more revenue before 2020. Therefore, the survey by itself cannot establish that ______<\/p>", "stem": "Which choice most logically completes the text?", "opts": ["larger businesses were more likely than smaller ones to adopt online ordering.", "businesses in Halden County reported their revenue for 2022.", "some businesses in Halden County adopted online ordering in 2020.", "adopting online ordering caused the higher revenue those businesses reported in 2022."]}, {"id": "EH-16", "mod": "EH", "n": 16, "section": "english", "type": "mc", "passage": "<p>The expedition's leader, who had crossed the glacier twice before ______ warned the team that the ice would be most dangerous in the late afternoon.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["before,", "before", "before;", "before—"]}, {"id": "EH-17", "mod": "EH", "n": 17, "section": "english", "type": "mc", "passage": "<p>Architect Sun-Hee Park designs buildings that respond to their surroundings ______ her library in a coastal town, for example, has walls that open to let in sea breezes during the summer.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["surroundings,", "surroundings", "surroundings;", "surroundings, whereas"]}, {"id": "EH-18", "mod": "EH", "n": 18, "section": "english", "type": "mc", "passage": "<p>The report identified three priorities for the city's parks department: replacing aging playground equipment ______ expanding the network of walking trails; and planting two thousand new trees by 2030.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["equipment,", "equipment;", "equipment:", "equipment"]}, {"id": "EH-19", "mod": "EH", "n": 19, "section": "english", "type": "mc", "passage": "<p>Medieval scribes developed hundreds of abbreviations to save both time and costly parchment ______ a few of these shortcuts still survive in modern writing.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["parchment;", "parchment,", "parchment", "parchment, as"]}, {"id": "EH-20", "mod": "EH", "n": 20, "section": "english", "type": "mc", "passage": "<p>The decline in local bee populations, along with recent changes in rainfall patterns, ______ forced many orchard owners in the region to rethink their planting schedules.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["have", "are", "were", "has"]}, {"id": "EH-21", "mod": "EH", "n": 21, "section": "english", "type": "mc", "passage": "<p>Carved from a single block of marble over the course of four years, ______<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["the sculptor finally unveiled the statue to an admiring crowd.", "the admiring crowd watched as the statue was finally unveiled.", "the unveiling of the statue finally drew an admiring crowd.", "the statue was finally unveiled to an admiring crowd."]}, {"id": "EH-22", "mod": "EH", "n": 22, "section": "english", "type": "mc", "passage": "<p>Along the cliff, the ______ nests, built by dozens of birds over a single spring, were made almost entirely of mud.<\/p>", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["swallow's", "swallows", "swallows'", "swallows's"]}, {"id": "EH-23", "mod": "EH", "n": 23, "section": "english", "type": "mc", "passage": "<p>The first cameras sold by the Harlan Camera Company needed several minutes to capture a single image, so anyone being photographed had to hold perfectly still. ______ people in the earliest Harlan portraits rarely smile; holding a smile for that long was nearly impossible.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["However,", "For example,", "As a result,", "Meanwhile,"]}, {"id": "EH-24", "mod": "EH", "n": 24, "section": "english", "type": "mc", "passage": "<p>The Vela Corporation's new battery holds a charge 30 percent longer than the company's previous model. ______ it costs nearly twice as much to produce, which may limit how widely it is adopted.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Consequently,", "In other words,", "That said,", "Likewise,"]}, {"id": "EH-25", "mod": "EH", "n": 25, "section": "english", "type": "mc", "passage": "<p>Researcher Lin Zhao found that students who took handwritten notes during a lecture remembered more of its content than students who typed their notes. ______ the typists recorded far more words than the handwriters did; they simply retained less of what they wrote down.<\/p>", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Consequently,", "Similarly,", "In particular,", "To be sure,"]}, {"id": "EH-26", "mod": "EH", "n": 26, "section": "english", "type": "mc", "passage": "<p>While researching a topic, a student has taken the following notes:<\/p><ul class='notes'><li>Ceramicist Hana Ito makes bowls using a technique called pit firing.<\/li><li>In pit firing, pots are buried in a pit with sawdust and leaves, which are then set alight.<\/li><li>Smoke and ash leave unpredictable patterns on the pots' surfaces.<\/li><li>Most ceramicists today use electric kilns.<\/li><li>Electric kilns allow precise control over firing temperature.<\/li><\/ul><p>The student wants to explain to an audience unfamiliar with pit firing how Ito's method differs from that of most ceramicists.<\/p>", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Ito makes bowls using pit firing, a technique that leaves unpredictable patterns.", "Most ceramicists today use electric kilns, which allow precise control over firing temperature.", "Unlike most ceramicists, who use electric kilns that allow precise temperature control, Ito buries her pots with sawdust and leaves and sets them alight, so smoke and ash leave unpredictable patterns.", "Ito's pit-fired bowls feature patterns left by smoke and ash."]}, {"id": "EH-27", "mod": "EH", "n": 27, "section": "english", "type": "mc", "passage": "<p>While researching a topic, a student has taken the following notes:<\/p><ul class='notes'><li>A study compared two ways of teaching fractions to fourth graders.<\/li><li>Group 1 was taught using number lines.<\/li><li>Group 2 was taught using pie diagrams.<\/li><li>On a test given right after instruction, both groups scored about the same.<\/li><li>On a test given three months later, Group 1 scored 18 points higher than Group 2.<\/li><\/ul><p>The student wants to present the study's key finding.<\/p>", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["A study compared two ways of teaching fractions to fourth graders: number lines and pie diagrams.", "In the study, fourth graders were taught fractions using either number lines or pie diagrams.", "Although students taught with number lines and those taught with pie diagrams scored about the same right after instruction, the number-line group scored 18 points higher three months later.", "Right after instruction, students taught with number lines and those taught with pie diagrams scored about the same."]}, {"id": "M1-01", "mod": "M1", "n": 1, "section": "math", "type": "mc", "passage": "", "stem": "If 5<i>x<\/i> + 8 = 43, what is the value of <i>x<\/i>?", "opts": ["7", "9.8", "10.2", "35"]}, {"id": "M1-02", "mod": "M1", "n": 2, "section": "math", "type": "mc", "passage": "", "stem": "A car travels 150 miles on 5 gallons of gasoline. At this rate, how many gallons of gasoline will the car use to travel 270 miles?", "opts": ["6", "8", "9", "54"]}, {"id": "M1-03", "mod": "M1", "n": 3, "section": "math", "type": "grid", "passage": "", "stem": "Two lines intersect at a point, forming four angles. One o const SEC = {
  english: {name: "Reading and Writing", short: "R&W", m1: "E1", easy: "EE", hard: "EH", minutes: 32, n: 27},
  math:    {name: "Math", short: "Math", m1: "M1", easy: "ME", hard: "MH", minutes: 35, n: 22}
};
const ROUTE_PCT = 0.60;
for (const s of Object.values(SEC)) s.cut = Math.ceil(ROUTE_PCT * s.n - 1e-9);
const PRIORITY = 60;
const QBY = {}; BANK.forEach(q => QBY[q.id] = q);
const LS = "satFullPractice_v1";
const BREAK_MIN = 10;

/* ===== state ===== */
let S = {current: null, history: []};
try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s && Array.isArray(s.history)) S = s; } catch (e) {}
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast("Couldn't save to this browser's storage."); } }
let view = {name: "home"}, tick = null, lastTick = 0, warned = {};

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plain = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent.replace(/\s+/g, " ").trim(); };
const pct = (c, t) => t ? Math.round(100 * c / t) : 0;
const fmtT = sec => { const neg = sec < 0; sec = Math.abs(Math.floor(sec)); const m = Math.floor(sec / 60), s = sec % 60; return (neg ? "+" : "") + m + ":" + String(s).padStart(2, "0"); };
const fmtD = iso => new Date(iso).toLocaleString([], {year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
const secOf = modKey => MODS[modKey].section;
const modLabel = k => MODS[k].label;
const pathOf = k => k === "EE" || k === "ME" ? "Easier" : (k === "EH" || k === "MH" ? "Harder" : "");
const kindName = k => k === "both" ? "Full test (Reading and Writing + Math)" : SEC[k].name;
const FLAG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1v14M3 2h9l-2 3 2 3H3" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></svg>';
function toast(msg, ms){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2600); }

function parseNum(raw){
  if (raw == null) return null;
  let s = String(raw).trim();
  if (!s) return null;
  if (/\d\s+\d/.test(s)) return null;               // mixed numbers like "1 1/2" are not accepted
  s = s.replace(/[\s$,]/g, "").replace(/[a-zA-Z%°]+$/, "").replace(/−/g, "-");
  if (/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  const m = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))\/([+-]?(?:\d+\.?\d*|\.\d+))$/);
  if (m) { const d = parseFloat(m[2]); return d === 0 ? null : parseFloat(m[1]) / d; }
  return null;
}
function isCorrect(id, a){
  const k = META[id]; if (a == null || String(a).trim() === "") return false;
  if (QBY[id].type === "mc") return a === k.ans;
  const v = parseNum(a); if (v === null) return false;
  return k.accept.some(x => Math.abs(x - v) < 1e-9);
}
const answered = a => a != null && String(a).trim() !== "";

/* ===== stats ===== */
function stats(qs){ // qs: [{id, ok}]
  const dom = {}, sk = {}, diff = {};
  for (const r of qs){ const m = META[r.id];
    const D = dom[m.domain] = dom[m.domain] || {c:0, t:0, section: QBY[r.id].section}; D.t++; if (r.ok) D.c++;
    const K = sk[m.skill] = sk[m.skill] || {c:0, t:0, domain: m.domain, section: QBY[r.id].section}; K.t++; if (r.ok) K.c++;
    const F = diff[m.diff] = diff[m.diff] || {c:0, t:0}; F.t++; if (r.ok) F.c++;
  }
  return {dom, sk, diff};
}
const statusTag = p => p < PRIORITY ? '<span class="tag p">Priority</span>' : (p >= 80 ? '<span class="tag s">Strength</span>' : '<span class="tag m">Developing</span>');
const diffTag = d => `<span class="tag ${d === "easy" ? "e" : d === "medium" ? "md" : "h"}">${d}</span>`;

/* ===== attempt lifecycle ===== */
function newMod(key){ return {key, answers: {}, flags: {}, elapsed: 0, q: 0, submitted: false}; }
function startAttempt(kind){
  if (S.current && !confirm("You have a test in progress. Starting a new one will discard it. Continue?")) return;
  const order = kind === "both" ? ["english", "math"] : [kind];
  S.current = {id: "a" + Date.now(), kind, order, secIdx: 0, startedAt: new Date().toISOString(), mods: [newMod(SEC[order[0]].m1)], stage: "ready", note: ""};
  save(); go("test");
}
const curMod = () => S.current.mods[S.current.mods.length - 1];
function submitModule(){
  const A = S.current, M = curMod();
  M.submitted = true;
  const ids = MODS[M.key].ids;
  M.correct = ids.filter(id => isCorrect(id, M.answers[id])).length;
  const sec = SEC[secOf(M.key)];
  stopTick();
  if (M.key === sec.m1){
    const next = M.correct >= sec.cut ? sec.hard : sec.easy;
    A.mods.push(newMod(next)); A.stage = "ready"; A.note = "Module 1 complete. Your answers are saved.";
  } else if (A.secIdx + 1 < A.order.length){
    A.secIdx++; A.mods.push(newMod(SEC[A.order[A.secIdx]].m1)); A.stage = "break"; A.breakStart = Date.now();
    A.note = SEC[A.order[A.secIdx - 1]].name + " section complete.";
  } else { finishAttempt(); return; }
  save(); go("test");
}
function finishAttempt(){
  const A = S.current;
  const rec = {id: A.id, kind: A.kind, startedAt: A.startedAt, finishedAt: new Date().toISOString(), sections: {}, questions: []};
  for (const sk of A.order){
    const mods = A.mods.filter(m => secOf(m.key) === sk);
    const m1 = mods[0], m2 = mods[1];
    const rs = {path: pathOf(m2.key), cut: SEC[sk].cut, mods: []};
    for (const m of [m1, m2]){
      const ids = MODS[m.key].ids; let c = 0;
      ids.forEach((id, i) => { const a = m.answers[id] ?? ""; const ok = isCorrect(id, a); if (ok) c++;
        rec.questions.push({id, mod: m.key, n: i + 1, a, ok, fl: !!m.flags[id]}); });
      rs.mods.push({key: m.key, correct: c, total: ids.length, time: Math.round(m.elapsed)});
    }
    rs.correct = rs.mods[0].correct + rs.mods[1].correct; rs.total = rs.mods[0].total + rs.mods[1].total;
    rec.sections[sk] = rs;
  }
  S.history.push(rec); S.current = null; save();
  go("result", {id: rec.id});
}

/* ===== timer ===== */
function startTick(){
  stopTick(); lastTick = Date.now();
  tick = setInterval(() => {
    if (!S.current || view.name !== "test" || S.current.stage !== "test") return stopTick();
    const now = Date.now(), M = curMod(); M.elapsed += (now - lastTick) / 1000; lastTick = now;
    drawTimer(); if (Math.floor(M.elapsed) % 5 === 0) save();
  }, 1000);
}
function stopTick(){ if (tick){ clearInterval(tick); tick = null; } }
function drawTimer(){
  const M = curMod(), sec = SEC[secOf(M.key)], left = sec.minutes * 60 - M.elapsed;
  const el = $("#tval"); if (!el) return;
  el.textContent = S.current.hideTimer ? "" : fmtT(left);
  const box = $("#timer"); box.classList.toggle("warn", left <= 300 && left > 0); box.classList.toggle("over", left <= 0);
  const b = $("#banner");
  if (left <= 0){ b.className = "banner over"; b.textContent = "Time is up for this module. On the real test it would end now; finish your current question and submit when ready (answers are not locked)."; }
  else if (left <= 300){ b.className = "banner"; b.textContent = "5 minutes remaining in this module."; if (!warned[M.key]){ warned[M.key] = 1; } }
  else b.className = "hidden";
}
document.addEventListener("visibilitychange", () => { if (document.hidden && S.current) save(); });
window.addEventListener("beforeunload", () => { if (S.current) save(); });

/* ===== routing ===== */
function go(name, args){
  view = Object.assign({name}, args || {}); stopTick();
  document.body.classList.toggle("testing", name === "test" && S.current && S.current.stage === "test");
  const app = $("#app");
  if (name === "test") app.innerHTML = renderTest();
  else app.innerHTML = nav() + '<div class="wrap">' + (name === "home" ? renderHome() : name === "result" ? renderResult(view.id) : name === "history" ? renderHistory() : renderWork()) + "</div>";
  bind(); window.scrollTo(0, 0);
  if (name === "test" && S.current && S.current.stage === "test"){ drawTimer(); startTick(); }
}
function nav(){
  const t = (n, l) => `<button class="tab ${view.name === n ? "on" : ""}" data-go="${n}">${l}</button>`;
  return `<div class="topnav"><div class="in"><span class="brand">SAT Practice Test</span>${t("home","Home")}${t("history","History")}${t("work","What to work on")}</div></div>`;
}

/* ===== home ===== */
function renderHome(){
  let h = `<h1>Full-Length Adaptive SAT Practice Test</h1>

   <div class="card choicecard"><h3>Math</h3><ul><li>2 modules &times; 22 questions (multiple choice and student-produced response)</li><li>35 minutes per module &middot; calculator allowed</li><li>About 70 minutes total</li></ul><button class="btn" data-start="math">Start Math</button></div>
   <div class="card choicecard"><h3>Full test</h3><ul><li>Reading and Writing, then Math</li><li>98 questions &middot; about 2 hours 14 minutes</li><li>Optional 10-minute break between sections</li></ul><button class="btn" data-start="both">Start full test</button></div></div>
  <div class="card"><h3 style="margin-top:0">How it works</h3><ul>
   <li><b>Adaptive, like the real test.</b> Module 1 of each section has a mix of easier and harder questions. If you answer at least 60% of Module 1 correctly (${SEC.english.cut}/27 in Reading and Writing, ${SEC.math.cut}/22 in Math), Module 2 is a harder set; otherwise it's an easier set.</li>
   <li><b>Timing.</b> Each module has a countdown timer. It warns you at 5 minutes and when time runs out, but it never locks your answers.</li>
