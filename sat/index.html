/* ===== test ===== */
function renderTest(){
  const A = S.current; if (!A) return nav() + '<div class="wrap"><p>No test in progress.</p></div>';
  const M = curMod(), sk = secOf(M.key), sec = SEC[sk], secNo = A.order.indexOf(sk) + 1, modNo = M.key === sec.m1 ? 1 : 2;
  const title = `Section ${secNo}, Module ${modNo}: ${sec.name}`;
  if (A.stage === "ready" || A.stage === "break"){
    let h = nav() + '<div class="wrap"><div class="card">';
    if (A.note) h += `<p class="note">${esc(A.note)}</p>`;
    if (A.stage === "break") h += `<h2>Break</h2><p>You may take an optional ${BREAK_MIN}-minute break before the next section. Break time remaining: <b id="brk">${BREAK_MIN}:00</b></p>`;
    h += `<h2>${title}</h2><ul><li>${sec.n} questions</li><li>${sec.minutes} minutes (the timer starts when you click Start)</li>${sk === "math" ? "<li>Calculator allowed for every question. A basic on-page calculator and a reference sheet are available.</li>" : ""}

     ${directions(sk)}<div class="row"><button class="btn" data-act="begin">Start Module ${modNo}</button><button class="btn sec" data-go="home">Save and exit</button></div></div></div>`;
    if (A.stage === "break") setTimeout(breakTimer, 0);

  }
  const ids = MODS[M.key].ids, N = ids.length;

  if (M.q >= N) main = renderReview(M, title);

    const q = QBY[ids[M.q]], a = M.answers[q.id];
    const head = `<div class="qhead"><span class="qbox">${M.q + 1}</span><button class="flagbtn ${M.flags[q.id] ? "on" : ""}" data-act="flag">${FLAG}${M.flags[q.id] ? "Marked for Review" : "Mark for Review"}</button></div>`;
    let ans;
    if (q.type === "mc") ans = '<div class="choices" role="radiogroup">' + q.opts.map((o, i) => { const L = "ABCD"[i];

/* calculator: safe recursive-descent parser (no eval) */
function calcEval(src){
  const s = src.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/\s+/g, "");
  let i = 0;
  const peek = () => s[i];
  function num(){ const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
  function primary(){
    const c = peek();
    if (c === "(") { i++; const v = expr(); if (peek() !== ")") throw 0; i++; return v; }
    if (c === "π") { i++; return Math.PI; }
    if (s.startsWith("pi", i)) { i += 2; return Math.PI; }
    if (c === "√") { i++; return Math.sqrt(unary()); }
    if (s.startsWith("sqrt", i)) { i += 4; return Math.sqrt(unary()); }
    return num();
  }
  function power(){ const b = primary(); if (peek() === "^") { i++; return Math.pow(b, unary()); } return b; }
  function unary(){ if (peek() === "-") { i++; return -unary(); } if (peek() === "+") { i++; return unary(); } return power(); }
  function term(){ let v = unary();
    for (;;) { const c = peek();
      if (c === "*") { i++; v *= unary(); } else if (c === "/") { i++; v /= unary(); }
      else if (c === "(" || c === "π" || c === "√" || (c && /[\d.]/.test(c)) || s.startsWith("pi", i) || s.startsWith("sqrt", i)) v *= unary();
      else return v; } }
  function expr(){ let v = term(); for (;;) { const c = peek(); if (c === "+") { i++; v += term(); } else if (c === "-") { i++; v -= term(); } else return v; } }
  const v = expr(); if (i !== s.length || !isFinite(v)) throw 0;
  return Math.round(v * 1e10) / 1e10;
}
function toggleCalc(){
  const ex = $("#calc"); if (ex) { ex.remove(); return; }
  const c = document.createElement("div"); c.id = "calc";
  const keys = ["7","8","9","÷","(","4","5","6","×",")","1","2","3","−","^","0",".","π","+","√","C","⌫","ans","=",""];
  c.innerHTML = `<div class="ch"><span>Calculator</span><button aria-label="Close calculator" data-k="x">&times;</button></div>
   <input id="cin" type="text" autocomplete="off" spellcheck="false" aria-label="Calculator input" placeholder="e.g. 3^2 + √16"><div class="res" id="cres"></div>
   <div class="keys">${keys.filter(k => k).map(k => `<button data-k="${k}" class="${"÷×−+^".includes(k) ? "op" : k === "=" ? "eq" : ""}">${k}</button>`).join("")}</div>`;
  document.body.appendChild(c);
  const inp = $("#cin"), res = $("#cres"); let last = "";
  const run = () => { try { const v = calcEval(inp.value); res.textContent = "= " + v; last = String(v); } catch (e) { res.textContent = "Error"; } };
  c.addEventListener("click", e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    if (k === "x") return c.remove(); if (k === "=") return run(); if (k === "C") { inp.value = ""; res.textContent = ""; return; }
    if (k === "⌫") { inp.value = inp.value.slice(0, -1); return; } if (k === "ans") { inp.value += last; return; }
    inp.value += k; inp.focus(); });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
  inp.focus();
}

   <p class="sub" style="margin-top:10px">Data is stored only in this browser on this device. Clearing browser data or using a different device starts fresh.</p>`;

function aggregate(){
  const out = {english: {}, math: {}}, last = {};
  for (const rec of S.history){
    for (const sk of Object.keys(rec.sections)){
      const st = recStats(rec, sk).sk;
      for (const [s, v] of Object.entries(st)){
        const A = out[sk][s] = out[sk][s] || {c: 0, t: 0, n: 0, domain: v.domain}; A.c += v.c; A.t += v.t; A.n++;
        last[s] = pct(v.c, v.t);
      }
    }
  }
  return {out, last};
}
function weakList(){
  const {out, last} = aggregate(), rows = [];
  for (const sk of ["english", "math"]) for (const [s, v] of Object.entries(out[sk])) rows.push({sk, s, ...v, p: pct(v.c, v.t), last: last[s]});
  rows.sort((a, b) => a.p - b.p || b.t - a.t);
  return rows;
}

    L.push(`Module 2 (${rs.path}): ${m2.correct}/${m2.total} (${pct(m2.correct, m2.total)}%, time used ${fmtT(m2.time)})`);
    L.push(`Section raw score: ${rs.correct}/${rs.total} (${pct(rs.correct, rs.total)}%)`);
    L.push("Domains:"); for (const [d, v] of Object.entries(st.dom)) L.push(`  - ${d}: ${v.c}/${v.t} (${pct(v.c, v.t)}%)${pct(v.c, v.t) < PRIORITY ? "  <-- PRIORITY" : ""}`);

    L.push("By difficulty: " + ["easy","medium","hard"].filter(d => st.diff[d]).map(d => `${d} ${st.diff[d].c}/${st.diff[d].t}`).join(", "));

    for (const m of rs.mods) L.push(`  ${modLabel(m.key)}: ` + rec.questions.filter(r => r.mod === m.key).map(r => `${r.n}:${answered(r.a) ? r.a : "-"}${r.ok ? "✓" : "✗(" + correctText(r.id) + ")"}`).join(" "));
  }

function allText(){
  const L = ["SAT PRACTICE: ALL ATTEMPTS (practice only; NOT a predicted SAT score)", "Exported: " + fmtD(new Date().toISOString()), "Attempts: " + S.history.length, "", "WEAKEST SKILLS ACROSS ALL ATTEMPTS (lowest first):"];
  weakList().forEach(r => L.push(`  - [${SEC[r.sk].short}] ${r.s}: ${r.c}/${r.t} (${r.p}%), latest attempt ${r.last}%${r.p < PRIORITY ? "  <-- PRIORITY" : ""}`));
  S.history.forEach((rec, i) => { L.push(""); L.push("#".repeat(60)); L.push(`ATTEMPT ${i + 1}`); L.push(attemptText(rec)); });
  return L.join("\n");
}
function copyText(txt){
  const fallback = () => modal(`<h2>Copy results</h2><p>Select all the text below and copy it.</p><textarea class="exp" readonly id="exptxt">${esc(txt)}</textarea><div class="row" style="margin-top:8px"><button class="btn sec" data-close>Close</button></div>`, true);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => toast("Results copied to clipboard."), fallback);
  else { const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); ok ? toast("Results copied to clipboard.") : fallback(); }
  window.__lastCopied = txt;
}
function download(txt, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type: "text/plain"})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ===== events ===== */
function bind(){ bindIn(document); }
function bindIn(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  root.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startAttempt(b.dataset.start));
  root.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go("result", {id: b.dataset.view}));
  root.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (confirm("Delete this attempt from history? This can't be undone.")) { S.history = S.history.filter(r => r.id !== b.dataset.del); save(); go("history"); } });
  root.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(attemptText(S.history.find(r => r.id === b.dataset.copy))));
  root.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => { const r = S.history.find(x => x.id === b.dataset.dl); download(attemptText(r), "sat-practice-" + r.finishedAt.slice(0, 10) + ".txt"); });
  root.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { curMod().q = +b.dataset.jump; save(); closeModal(); go("test"); });
  root.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => { const M = curMod(), id = MODS[M.key].ids[M.q];
    M.answers[id] = M.answers[id] === b.dataset.ch ? "" : b.dataset.ch; save();
    root.querySelectorAll("[data-ch]").forEach(x => { const on = x.dataset.ch === M.answers[id]; x.classList.toggle("sel", on); x.setAttribute("aria-checked", on); }); });
  const gi = root.querySelector("#gi");
  if (gi){ const pv = () => { const v = gi.value.trim(), n = parseNum(v), p = $("#pv");
      if (!v) { p.textContent = ""; p.className = "pv"; return; }
      if (n === null) { p.textContent = /\d\s+\d/.test(v) ? "Mixed numbers aren't accepted. Enter an improper fraction like 7/2." : "This isn't a valid number yet."; p.className = "pv bad"; }
      else { p.textContent = "Answer preview: " + v.replace(/[%$°]/g, "") ; p.className = "pv"; } };
    gi.oninput = () => { const M = curMod(); M.answers[MODS[M.key].ids[M.q]] = gi.value; save(); pv(); }; pv(); }
  root.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(b.dataset.act));
  ["fsec", "fskill", "fdiff"].forEach(id => { const el = root.querySelector("#" + id); if (el) el.onchange = filterMiss; });
}
function filterMiss(){
  const s = $("#fsec").value, k = $("#fskill").value, d = $("#fdiff").value;
  document.querySelectorAll(".mwrap").forEach(w => w.classList.toggle("hidden", (s && w.dataset.sec !== s) || (k && w.dataset.skill !== k) || (d && w.dataset.diff !== d)));
}
function act(a){
  const A = S.current;
  switch (a){
    case "resume": go("test"); break;
    case "abandon": if (confirm("Discard the test in progress? Its answers will be lost.")) { S.current = null; save(); go("home"); } break;
    case "begin": A.stage = "test"; A.note = ""; save(); go("test"); break;
    case "next": curMod().q++; save(); go("test"); break;
    case "back": curMod().q = Math.max(0, curMod().q - 1); save(); go("test"); break;
    case "flag": { const M = curMod(), id = MODS[M.key].ids[M.q]; M.flags[id] = !M.flags[id]; if (!M.flags[id]) delete M.flags[id]; save();
      const b = document.querySelector(".flagbtn"); b.classList.toggle("on", !!M.flags[id]); b.innerHTML = FLAG + (M.flags[id] ? "Marked for Review" : "Mark for Review"); break; }
    case "grid": { const M = curMod(), sk = secOf(M.key);
      modal(`<div class="row" style="justify-content:space-between"><b>Section ${A.order.indexOf(sk) + 1}, Module ${M.key === SEC[sk].m1 ? 1 : 2}: ${SEC[sk].name} Questions</b><button class="btn sm sec" data-close>Close</button></div>${legend}${qgrid(M)}<div style="text-align:center;margin-top:14px"><button class="btn sec" data-jump="${MODS[M.key].ids.length}">Go to Review Page</button></div>`); break; }
    case "submitmod": { const M = curMod(), ids = MODS[M.key].ids, un = ids.filter(id => !answered(M.answers[id])).length;
      if (confirm((un ? `You have ${un} unanswered question${un > 1 ? "s" : ""}. There's no penalty for guessing. ` : "") + "Submit this module? You won't be able to return to it.")) submitModule(); break; }
    case "hidet": A.hideTimer = !A.hideTimer; save(); document.querySelector("[data-act=hidet]").textContent = A.hideTimer ? "Show" : "Hide"; drawTimer(); break;
    case "calc": toggleCalc(); break;
    case "ref": refSheet(); break;
    case "dir": modal(directions(secOf(curMod().key)).replace("<details", "<details open") + '<div class="row"><button class="btn sec" data-close>Close</button></div>', true); break;
    case "exit": { save(); const c = $("#calc"); if (c) c.remove(); go("home"); toast("Progress saved. Resume from Home."); break; }
    case "copyall": copyText(allText()); break;
    case "dlall": download(allText(), "sat-practice-all-attempts.txt"); break;
    case "reset": if (confirm("Reset ALL data? This deletes every saved attempt and any test in progress from this browser.") && confirm("Are you sure? This cannot be undone.")) { S = {current: null, history: []}; save(); go("home"); toast("All practice data was reset."); } break;
  }
}
window.__sat = {get state(){ return S; }, parseNum, calcEval, attemptText, allText, SEC};
document.addEventListener("DOMContentLoaded", () => go("home"));
</script></body></html>
